[project]
name = "lpf-250hz-ihp130"
version = "0.1.0"
description = "Agentic redesign of a 250 Hz super-source-follower LPF in the open IHP SG13G2 130 nm PDK"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "spicexplorer-harness",
]

[tool.uv.sources]
# The generic harness (ledger, lints, context pack, spec) comes from the platform checkout that
# sits beside this repo in spicexplorer-workspace; edit the path if the repo lives elsewhere.
spicexplorer-harness = { path = "../../spicexplorer-platform/packages/spicexplorer-harness", editable = true }

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
