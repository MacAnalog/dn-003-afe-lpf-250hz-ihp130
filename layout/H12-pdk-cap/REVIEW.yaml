    x1: 157.88
    y1: 156.74
  evidence: 'rows read back from the rebuilt GDS + the extracted per-net shapes: rows at y=116.94 and y=148.74 belong
    to net vbr (= the four xr3 units), the row at y=132.84 to net2/net3 (= xm9/xm10). LayoutParams has bias_dummy_cols
    but no bias_dummy_rows; the array''s top and bottom neighbours are the island-A tap bar and the gmf_a row, not
    dummies. First-order x and y gradients do cancel (centroids coincide), but the numerator of the tightest ratio
    in the cell sits entirely on edge rows while the denominator sits on the interior row, so the row-edge systematic
    and any quadratic y-profile add directly to the ratio. brief.json rep_sink_ratio tolerates dvgs_common 0.346
    mV nominal / 0.178 mV pvt at 3.51 Hz/mV.'
